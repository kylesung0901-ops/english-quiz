<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --line:#e3e6ec; --ink:#1c2029; --sub:#666e7d;
  --accent:#2f6bff; --accent-soft:#eaf0ff; --ok:#12855a; --ok-soft:#e6f6ef;
  --no:#d13b3b; --no-soft:#fdecec; --warn:#b06a00; --warn-soft:#fff6e5;
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  line-height:1.65;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 80px}
header.top{background:linear-gradient(135deg,#2f6bff,#5b3df5);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:16px}
header.top h1{margin:0 0 6px;font-size:21px;letter-spacing:-.4px}
header.top p{margin:0;font-size:13px;opacity:.92}
.badges{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.badge{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:3px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2.sec{font-size:17px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--accent)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
details>summary{cursor:pointer;font-weight:700;font-size:16px;list-style:none;outline:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--accent)}
details[open]>summary::before{content:"▾ "}
.struct{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.struct h3{font-size:15px;margin:0 0 8px}
pre.formula{background:#12151c;color:#e8ecf5;font-family:var(--mono);font-size:13px;
  padding:11px 12px;border-radius:9px;overflow-x:auto;margin:0 0 10px;line-height:1.7}
ul.ex{margin:0 0 10px;padding-left:18px}
ul.ex li{margin:4px 0;font-size:14.5px}
ul.ex li .ko{color:var(--sub);font-size:13px}
ol.memo{margin:0;padding-left:22px}
ol.memo li{margin:9px 0;font-size:14.5px}
ol.memo li .en{font-weight:600}
ol.memo li .ko{display:block;color:var(--sub);font-size:13px;margin-top:1px}
.fixbox{background:#fbfcfe;border:1px solid var(--line);border-left:4px solid var(--warn);
  border-radius:9px;padding:10px 12px;margin-top:8px}
.fixbox .bad{color:var(--no);font-family:var(--mono);font-size:13.5px;word-break:break-word}
.fixbox .good{color:var(--ok);font-family:var(--mono);font-size:13.5px;font-weight:600;word-break:break-word;margin-top:3px}
.fixbox .pt{color:var(--sub);font-size:12.5px;margin-top:6px}
.pron{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.pron .row{background:#f4f7ff;border:1px solid #dde5fb;border-radius:9px;padding:9px 11px}
.pron .en{font-family:var(--mono);font-size:14px;font-weight:600}
.pron .kr{color:var(--accent);font-weight:700;font-size:14px}
.pron .why{color:var(--sub);font-size:12.5px;margin-top:2px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px}
.qhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.qnum{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;
  border-radius:8px;padding:2px 9px;flex:0 0 auto}
.tag{background:#f1f2f5;color:var(--sub);font-size:11.5px;border-radius:999px;padding:2px 8px;flex:0 0 auto}
.ko-prompt{font-size:15px;font-weight:600;margin:2px 0 10px}
.opts label{display:block;background:#fafbfd;border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;margin-bottom:6px;font-size:14.5px;cursor:pointer;word-break:break-word}
.opts label:hover{border-color:var(--accent)}
.opts input{margin-right:7px}
.opts label.sel{background:var(--accent-soft);border-color:var(--accent)}
.opts label.right{background:var(--ok-soft);border-color:var(--ok)}
.opts label.wrong{background:var(--no-soft);border-color:var(--no)}
.blank{font-family:var(--mono);font-size:14.5px;background:#fafbfd;border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;margin-bottom:8px;word-break:break-word}
input[type=text],textarea{width:100%;font-family:inherit;font-size:15px;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.hint{color:var(--sub);font-size:12.5px;margin-top:5px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700}
.btn{background:var(--accent);color:#fff;padding:13px 18px;font-size:16px;width:100%}
.btn.sec{background:#eef0f5;color:var(--ink)}
.btn.sm{width:auto;padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.res{margin-top:9px;border-radius:9px;padding:10px 12px;font-size:14px}
.res.ok{background:var(--ok-soft);border:1px solid #bfe6d5}
.res.no{background:var(--no-soft);border:1px solid #f4c9c9}
.arrow{font-family:var(--mono);font-size:13.5px;margin-top:5px;word-break:break-word}
.arrow .b{color:var(--no)}
.arrow .g{color:var(--ok);font-weight:600}
.scorecard{background:linear-gradient(135deg,#101a33,#2b1a55);color:#fff;border-radius:16px;padding:22px 18px;text-align:center;margin-bottom:14px}
.scorecard .big{font-size:38px;font-weight:800;letter-spacing:-1px}
.scorecard .msg{font-size:14px;opacity:.92;margin-top:6px}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner.err{background:var(--no-soft);border:1px solid #f4c9c9;color:#8e2020}
.banner.info{background:var(--warn-soft);border:1px solid #f0dcb4;color:#7a4a00}
.linkbox{background:#f4f7ff;border:1px solid #dde5fb;border-radius:11px;padding:12px;margin-top:10px}
.linkbox code{display:block;font-family:var(--mono);font-size:13px;word-break:break-all;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;
  max-height:120px;overflow:auto}
.mark{display:inline-flex;gap:6px}
.mark button{padding:5px 13px;font-size:15px;background:#eef0f5;color:var(--sub)}
.mark button.on-ok{background:var(--ok);color:#fff}
.mark button.on-no{background:var(--no);color:#fff}
.kyleans{background:#fffdf3;border:1px solid #f0e6c4;border-radius:9px;padding:9px 11px;
  font-family:var(--mono);font-size:14px;margin:6px 0;word-break:break-word}
.kyleans .lb{font-family:inherit;font-size:12px;color:var(--sub);display:block;margin-bottom:2px}
.model{background:var(--ok-soft);border:1px solid #bfe6d5;border-radius:9px;padding:9px 11px;
  font-size:14.5px;margin-top:7px;word-break:break-word}
.model .lb{font-size:12px;color:var(--sub);display:block;margin-bottom:2px}
.foot{color:var(--sub);font-size:12.5px;text-align:center;margin-top:24px;line-height:1.8}
.review-list{margin:6px 0 0;padding-left:18px}
.review-list li{font-size:14px;margin:3px 0}
.hidden{display:none !important}
table.sig{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.sig td{border:1px solid var(--line);padding:7px 9px;vertical-align:top}
table.sig td:first-child{background:#fafbfd;font-weight:600;width:46%}
table.sig td:last-child{font-family:var(--mono);font-size:13.5px;color:var(--accent);font-weight:700}
@media(max-width:420px){body{font-size:15px}.wrap{padding:12px 10px 70px}}

/* ============================================================ 유틸 */
function el(tag, cls, html){ var e=document.createElement(tag); if(cls)e.className=cls;
  if(html!==undefined)e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){
  return String(s||'').replace(/[‘’ʼ´`]/g,"'").replace(/[“”]/g,'"')
    .toLowerCase().replace(/[.,!?;:"()]/g,'').replace(/\s+/g,' ').trim();
}

/* 영작 자동 판정 — 대문자·마침표·쉼표·홑따옴표 모양은 채점하지 않는다 (kyle 확정 2026-08-25).
   내용이 모범답안과 같으면 자가 채점 버튼과 무관하게 무조건 맞음 처리한다. */
function trAuto(mine, model){
  var a=norm(mine), b=norm(model);
  if(!a) return false;
  if(a===b) return true;
  /* 부분 영작(앞절 제공): 뒷절만 써도 모범답안의 뒷부분과 같으면 맞음 */
  var q=null, list=(typeof TR!=='undefined'&&TR)?TR:[];
  for(var i=0;i<list.length;i++){ if(list[i].m===model){ q=list[i]; break; } }
  if(q && /앞절 제공/.test(q.ko||'')){
    var front=(String(q.ko).match(/〔앞절 제공〕\s*(.*?)\s*______/)||[])[1]||'';
    var nf=norm(front);
    if(nf && b.indexOf(nf)===0){ var tail=b.slice(nf.length).trim(); if(tail && a===tail) return true; }
  }
  return false;
}
function trOK(mine, model, self){
  if(trAuto(mine, model)) return true;
  return self===1;
}
function matchFB(user, list){
  var u=norm(user); if(!u) return false;
  for(var i=0;i<list.length;i++){
    var c=norm(list[i]);
    if(u===c) return true;
    if(u.replace(/'/g,'')===c.replace(/'/g,'')) return true;
  }
  return false;
}
function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o))))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s=String(s).replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function b64bytes(s){
  s=String(s).replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
  var bin=atob(s), out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function unz(s){
  return new Promise(function(res, rej){
    try{
      if(typeof DecompressionStream === 'undefined'){ rej(new Error('no ds')); return; }
      var st = new Blob([b64bytes(s)]).stream().pipeThrough(new DecompressionStream('gzip'));
      new Response(st).arrayBuffer().then(function(buf){
        res(JSON.parse(new TextDecoder().decode(buf)));
      }).catch(rej);
    }catch(e){ rej(e); }
  });
}

/* ---------- jsonblob ---------- */
var BLOB_API='https://jsonblob.com/api/jsonBlob';
function blobCreate(data, cb){
  var tries=0;
  function go(){
    tries++;
    fetch(BLOB_API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(data)}).then(function(r){
      var id=r.headers.get('x-jsonblob-id')||r.headers.get('X-jsonblob-Id');
      if(!id){ var loc=r.headers.get('Location')||r.headers.get('location')||'';
        var m=String(loc).match(/([0-9a-zA-Z_-]+)\s*$/); if(m) id=m[1]; }
      if(id) cb(id); else throw new Error('no id');
    }).catch(function(){ if(tries<2) setTimeout(go,700); else cb(null); });
  }
  go();
}
function blobRead(id, cb){
  fetch(BLOB_API+'/'+id,{headers:{'Accept':'application/json'}})
    .then(function(r){ if(!r.ok) throw new Error('bad'); return r.json(); })
    .then(function(j){ cb(j); }).catch(function(){ cb(null); });
}
function blobUpdate(id, data, cb){
  fetch(BLOB_API+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(data)}).then(function(r){ cb(r.ok); }).catch(function(){ cb(false); });
}

var shCount=0;
function jsonp(host, longUrl, cb){
  var name='__sh'+(++shCount), done=false, s=document.createElement('script');
  window[name]=function(r){ done=true; try{delete window[name];}catch(e){window[name]=undefined;}
    if(s.parentNode) s.parentNode.removeChild(s); cb(r&&r.shorturl?r.shorturl:null); };
  s.src='https://'+host+'/create.php?format=json&callback='+name+'&url='+encodeURIComponent(longUrl);
  s.onerror=function(){ if(!done){done=true;cb(null);} };
  document.body.appendChild(s);
  setTimeout(function(){ if(!done){done=true;cb(null);} },6000);
}

/* ============================================================
   이미지 저장 모듈 (2026-08-21 추가 — kyle 요청)
   ① 풀기 전: 문제지 PNG   ② 채점 후: 채점표 PNG
   외부 라이브러리 없음. SVG foreignObject → canvas → PNG.
   높이가 길면 여러 장으로 자동 분할.
   ============================================================ */
var IMG_W = 900, IMG_MAXH = 4200, IMG_SCALE = 3, IMG_PAD = 28;
var IMG_FONT = "'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif";

function ie(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function imgDl(blob, name){
  var a=document.createElement('a'), u=URL.createObjectURL(blob);
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 1500);
}

function imgMeasure(html, w){
  var m=document.createElement('div');
  m.style.cssText='position:fixed;left:-99999px;top:0;width:'+w+'px;font-family:'+IMG_FONT+';line-height:1.6;font-size:16px;color:#1c2029;';
  m.innerHTML=html; document.body.appendChild(m);
  var h=m.offsetHeight; document.body.removeChild(m); return h;
}

function imgRender(inner, name){
  return new Promise(function(res, rej){
    var h = imgMeasure(inner, IMG_W);
    var tw = IMG_W + IMG_PAD*2, th = h + IMG_PAD*2;

    /* 캔버스 한계 안에서 최대 배율 자동 선택 (한 장으로 뽑기 위해) */
    var MAXDIM = 32000, MAXAREA = 260000000;
    var sc = IMG_SCALE;
    sc = Math.min(sc, MAXDIM/th, MAXDIM/tw, Math.sqrt(MAXAREA/(tw*th)));
    if(sc < 1) sc = 1;
    sc = Math.round(sc*100)/100;

    var body = '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+IMG_W+'px;padding:'+IMG_PAD+'px;'
      + 'background:#ffffff;font-family:'+IMG_FONT+';color:#1c2029;line-height:1.6;font-size:16px;">'+inner+'</div>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+tw+'" height="'+th+'">'
      + '<foreignObject x="0" y="0" width="100%" height="100%">'+body+'</foreignObject></svg>';

    /* 반드시 data: URL. blob: URL 을 쓰면 크롬이 캔버스를 오염시켜
       toBlob 이 'Tainted canvases may not be exported' 로 실패한다. (2026-08-21 확인) */
    var img = new Image();
    img.onload = function(){
      var cv, ctx;
      try{
        cv=document.createElement('canvas');
        cv.width=Math.round(tw*sc); cv.height=Math.round(th*sc);
        ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.drawImage(img,0,0,cv.width,cv.height);
      }catch(e){ rej({code:'DRAW', msg:String(e&&e.message||e)}); return; }
      try{
        cv.toBlob(function(b){
          if(!b){ rej({code:'BLOB', msg:'toBlob null'}); return; }
          imgDl(b, name+'.png');
          res({w:cv.width, h:cv.height, size:b.size});
        },'image/png');
      }catch(e){ rej({code:'TAINT', msg:String(e&&e.message||e)}); }
    };
    img.onerror = function(){ rej({code:'SVG', msg:'SVG 이미지를 불러오지 못했습니다'}); };
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

function imgPages(blocks){
  var hs = blocks.map(function(b){ return imgMeasure(b, IMG_W); });
  var pages=[], cur=[], curH=0;
  blocks.forEach(function(b,i){
    if(curH + hs[i] > IMG_MAXH && cur.length){ pages.push(cur); cur=[]; curH=0; }
    cur.push(b); curH += hs[i];
  });
  if(cur.length) pages.push(cur);
  return pages;
}

function doGrade(out, btn){
  var miss=[];
  ans.mc.forEach(function(v,i){ if(v===null) miss.push(i+1); });
  ans.fb.forEach(function(v,i){ if(!String(v).trim()) miss.push(MC.length+i+1); });
  ans.tr.forEach(function(v,i){ if(!String(v).trim()) miss.push(MC.length+FB.length+i+1); });
  out.innerHTML='';
  if(miss.length){
    out.appendChild(el('div','banner info','⚠️ 아직 답하지 않은 문항: <b>'+miss.join(', ')+'</b>번 — 그래도 채점하려면 한 번 더 누르세요.'));
    if(!btn.dataset.warned){ btn.dataset.warned='1'; return; }
  }
  var score=0, weak=[];
  MC.forEach(function(q,i){
    var c=document.getElementById('mc'+i), labels=c.querySelectorAll('.opts label');
    labels.forEach(function(l){ l.classList.remove('sel','right','wrong'); });
    labels[q.a].classList.add('right');
    var ok=(ans.mc[i]===q.a);
    if(ok) score++; else { weak.push(q.tag); if(ans.mc[i]!==null) labels[ans.mc[i]].classList.add('wrong'); }
    var r=c.querySelector('.res'); r.className='res '+(ok?'ok':'no');
    r.innerHTML=(ok?'⭕ 정답':'❌ 오답 — 정답 '+'ABCD'[q.a])+' <span class="tag">'+esc(q.tag)+'</span>'+
      (q.bad?'<div class="arrow"><span class="b">❌ '+esc(q.bad)+'</span> → <span class="g">⭕ '+esc(q.good)+'</span></div>':'')+
      '<div class="hint">'+esc(q.pt)+'</div>';
    c.querySelectorAll('input').forEach(function(x){ x.disabled=true; });
  });
  FB.forEach(function(q,i){
    var c=document.getElementById('fb'+i), ok=matchFB(ans.fb[i],q.a);
    if(ok) score++; else weak.push(q.tag);
    var r=c.querySelector('.res'); r.className='res '+(ok?'ok':'no');
    r.innerHTML=(ok?'⭕ 정답':'❌ 오답')+' <span class="tag">'+esc(q.tag)+'</span>'+
      '<div class="arrow"><span class="b">❌ '+esc(ans.fb[i]||'(무응답)')+
      '</span> → <span class="g">⭕ '+esc(q.a[0])+'</span></div><div class="hint">'+esc(q.pt)+'</div>';
    c.querySelector('input').disabled=true;
  });
  TR.forEach(function(q,i){ if(trOK(ans.tr[i], q.m, trSelf[i])) score++; else weak.push(q.tag); });

  var msg = score>=27?'거의 완벽해요. 오늘 구조는 몸에 붙었습니다.'
          : score>=21?'좋아요. 틀린 구조만 내일 한 번 더 짚읍시다.'
          : score>=14?'절반은 잡았어요. 통암기 12문장을 소리 내어 한 번 더.'
          : '괜찮아요. 오늘은 통암기 문장을 소리 내어 읽는 것부터.';
  var sc=el('div','scorecard');
  sc.innerHTML='<div class="big">'+score+' / '+TOTAL+'</div><div class="msg">'+esc(msg)+'</div>';
  out.appendChild(sc);

  var uniq=weak.filter(function(v,i,a){ return a.indexOf(v)===i; });
  if(uniq.length){
    var rv=el('div','card'); rv.appendChild(el('div','','<b>🔁 다시 볼 구조</b>'));
    var ul=el('ul','review-list');
    uniq.forEach(function(t){ ul.appendChild(el('li','',esc(t))); });
    rv.appendChild(ul); out.appendChild(rv);
  }

  var ib=el('div','card');
  ib.appendChild(el('div','','<b>🖼 채점표를 이미지로 저장</b>'));
  ib.appendChild(el('div','hint','문항별 ⭕❌ · 내 답 · 정답 · ❌→⭕ 해설이 이미지 한 장으로 저장됩니다.'));
  var ibb=el('button','btn sec','🖼 채점표 이미지 저장 (한 장)'); ibb.style.marginTop='9px';
  var ibs=el('div',''); ibs.style.marginTop='9px';
  ibb.onclick=function(){
    imgExport(ibb, resultBlocks(score, weak), 'kyle 데일리 영어 퀴즈 — 채점표',
      ie(QUIZ.date)+' ('+ie(QUIZ.day)+') · 점수 '+score+' / '+TOTAL,
      '#101a33', 'quiz-'+QUIZ.date+'-채점표', ibs);
  };
  ib.appendChild(ibb); ib.appendChild(ibs); out.appendChild(ib);

  var mk=el('button','btn','🔗 올인원 링크 만들기 (선생님께 보내기)'); mk.style.marginTop='6px';
  out.appendChild(mk);
  var lz=el('div',''); out.appendChild(lz);
  mk.onclick=function(){
    var lite={v:2,d:QUIZ.date,a:ans,self:trSelf,score:score};
    var code=b64e(lite);
    lz.innerHTML='';
    lz.appendChild(linkBox('방법 1. 선생님께 이 링크를 보내세요', BASE+'#s='+code,
      '오늘 날짜 주소로 만든 링크라 같은 문제로 열립니다.'));
    var cb=el('div','linkbox');
    cb.appendChild(el('div','','<b>방법 2. 링크가 안 열리면 이 답안 코드를 보내세요</b>'));
    var ta2=el('textarea',''); ta2.readOnly=true; ta2.value=code; ta2.style.minHeight='90px'; ta2.style.fontFamily='var(--mono)'; ta2.style.fontSize='12px';
    cb.appendChild(ta2);
    var cp=el('button','btn sec sm','코드 복사하기'); cp.style.marginTop='8px';
    cp.onclick=function(){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){cp.textContent='복사됨 ✓';});} else {ta2.select();try{document.execCommand('copy');cp.textContent='복사됨 ✓';}catch(e){}} };
    cb.appendChild(cp);
    cb.appendChild(el('div','hint','선생님은 오늘 날짜 페이지 맨 아래 [받은 코드로 채점하기]에 붙여넣으면 됩니다.'));
    lz.appendChild(cb);
    mk.style.display='none';
  };
  if(out.offsetTop) window.scrollTo({top:out.offsetTop-20,behavior:'smooth'});
}

/* ============================================================ MODE 2 채점 */
function renderGrade(data, blobId){
  header('채점 모드 — kyle의 답안을 봐 주세요',['총 '+TOTAL+'문항','⭕/❌ + 코멘트','총평']);
  var a=data.a, self=data.self||[], marks={}, comments={};
  var pre=(data.g&&data.g.marks)||null, preC=(data.g&&data.g.comments)||null;
  var idx=0;
  function block(qnum, tag, ko, kyleAns, model, key, autoOk){
    var c=el('div','q');
    var hd=el('div','qhead');
    hd.appendChild(el('span','qnum','Q'+qnum));
    hd.appendChild(el('span','tag',esc(tag)));
    c.appendChild(hd);
    c.appendChild(el('div','ko-prompt',esc(ko)));
    c.appendChild(el('div','kyleans','<span class="lb">kyle의 답</span>'+esc(kyleAns||'(무응답)')));
    c.appendChild(el('div','model','<span class="lb">정답 / 모범답안</span>'+esc(model)));
    if(key) c.appendChild(el('div','hint','🔑 '+esc(key)));
    var mark=el('div','mark'); mark.style.marginTop='8px';
    var bo=el('button','','⭕'), bn=el('button','','❌');
    var init=(pre&&pre[qnum]!==undefined)?pre[qnum]:autoOk;
    function set(v){ marks[qnum]=v; bo.className=v===1?'on-ok':''; bn.className=v===0?'on-no':''; }
    bo.onclick=function(){set(1);}; bn.onclick=function(){set(0);};
    set(init===null||init===undefined?null:init);
    mark.appendChild(bo); mark.appendChild(bn); c.appendChild(mark);
    var ta=el('textarea',''); ta.placeholder='코멘트 (❌ 틀린 조각 → ⭕ 고친 조각)';
    ta.style.marginTop='8px';
    if(preC&&preC[qnum]) ta.value=preC[qnum];
    comments[qnum]=ta.value||'';
    ta.oninput=function(){ comments[qnum]=ta.value; };
    c.appendChild(ta); app.appendChild(c);
  }
  app.appendChild(el('h2','sec','Part 1. 객관식'));
  MC.forEach(function(q,i){ idx++;
    var pick=a.mc[i];
    var txt=(pick===null||pick===undefined)?'(무응답)':'ABCD'[pick]+'. '+q.o[pick];
    block(idx,q.tag,q.ko,txt,'ABCD'[q.a]+'. '+q.o[q.a],q.pt,pick===q.a?1:0);
  });
  app.appendChild(el('h2','sec','Part 2. 빈칸'));
  FB.forEach(function(q,i){ idx++;
    block(idx,q.tag,q.ko+'  〔'+q.s+'〕',a.fb[i],q.a[0],q.pt,matchFB(a.fb[i],q.a)?1:0); });
  app.appendChild(el('h2','sec','Part 3. 영작'));
  TR.forEach(function(q,i){ idx++;
    block(idx,q.tag,q.ko,a.tr[i],q.m,q.k,(trAuto(a.tr[i],q.m)?1:(self[i]===1?1:(self[i]===0?0:null)))); });

  var ov=el('div','card'); ov.appendChild(el('div','','<b>📩 총평</b>'));
  var ota=el('textarea',''); ota.placeholder='오늘 kyle에게 한 마디 (짧게)'; ota.style.marginTop='8px';
  if(data.g&&data.g.overall) ota.value=data.g.overall;
  ov.appendChild(ota); app.appendChild(ov);

  var save=el('button','btn','💾 채점 저장하기'); app.appendChild(save);
  var out=el('div',''); app.appendChild(out);
  save.onclick=function(){
    var n=0; for(var k=1;k<=TOTAL;k++) if(marks[k]===undefined||marks[k]===null) n++;
    if(n&&!save.dataset.warned){ save.dataset.warned='1'; out.innerHTML='';
      out.appendChild(el('div','banner info','⚠️ ⭕/❌ 표시가 없는 문항이 '+n+'개 있습니다. 그대로 저장하려면 한 번 더 누르세요.')); return; }
    var total=0; for(var k2=1;k2<=TOTAL;k2++) if(marks[k2]===1) total++;
    var newData={v:2,d:data.d||QUIZ.date,q:QUIZ,a:a,self:self,score:data.score,
      g:{marks:marks,comments:comments,overall:ota.value,total:total}};
    save.disabled=true; out.innerHTML='';
    var liteF={v:2,d:newData.d,a:a,self:self,score:data.score,g:newData.g};
    var codeF=b64e(liteF);
    out.appendChild(linkBox('방법 1. kyle에게 이 결과 링크를 보내세요',BASE+'#f='+codeF,'오늘 날짜 주소로 열어야 같은 문제로 보입니다.'));
    var cb2=el('div','linkbox');
    cb2.appendChild(el('div','','<b>방법 2. 링크가 안 열리면 이 결과 코드를 보내세요</b>'));
    var taF=el('textarea',''); taF.readOnly=true; taF.value=codeF; taF.style.minHeight='90px'; taF.style.fontFamily='var(--mono)'; taF.style.fontSize='12px';
    cb2.appendChild(taF);
    var cpF=el('button','btn sec sm','코드 복사하기'); cpF.style.marginTop='8px';
    cpF.onclick=function(){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(codeF).then(function(){cpF.textContent='복사됨 ✓';});} else {taF.select();try{document.execCommand('copy');cpF.textContent='복사됨 ✓';}catch(e){}} };
    cb2.appendChild(cpF);
    cb2.appendChild(el('div','hint','kyle은 오늘 날짜 페이지 맨 아래 [받은 코드로 채점하기]에 붙여넣으면 결과가 보입니다.'));
    out.appendChild(cb2);
    save.style.display='none';
  };
  foot();
}

/* ============================================================ MODE 3 첨삭 확인 */
function renderReview(data, blobId){
  var g=data.g||{}, total=g.total;
  if(total===undefined){ total=0; for(var k=1;k<=TOTAL;k++) if(g.marks&&g.marks[k]===1) total++; }
  header('첨삭 확인 — 선생님 채점 결과',['최종 '+total+'/'+TOTAL,'문항별 코멘트','총평']);
  var msg = total>=27?'거의 완벽합니다. 오늘 구조는 몸에 붙었어요.'
          : total>=21?'좋습니다. 틀린 구조만 내일 한 번 더 짚읍시다.'
          : total>=14?'절반은 잡았습니다. 아래 코멘트를 소리 내어 3번씩.'
          : '괜찮습니다. 통암기 문장을 소리 내어 읽는 것부터 다시.';
  var sc=el('div','scorecard');
  sc.innerHTML='<div class="big">'+total+' / '+TOTAL+'</div><div class="msg">'+esc(msg)+'</div>';
  app.appendChild(sc);
  if(g.overall){
    var ov=el('div','card'); ov.appendChild(el('div','','<b>📩 선생님 총평</b>'));
    ov.appendChild(el('div','',esc(g.overall).replace(/\n/g,'<br>'))); app.appendChild(ov);
  }
  var a=data.a, idx=0, weak=[];
  function row(qnum, tag, ko, kyleAns, model, key){
    var ok=g.marks&&g.marks[qnum]===1;
    if(!ok) weak.push(tag);
    var c=el('div','q');
    var hd=el('div','qhead');
    hd.appendChild(el('span','qnum','Q'+qnum));
    hd.appendChild(el('span','tag',esc(tag)));
    hd.appendChild(el('span','tag',ok?'⭕':'❌'));
    c.appendChild(hd);
    c.appendChild(el('div','ko-prompt',esc(ko)));
    c.appendChild(el('div','kyleans','<span class="lb">내 답</span>'+esc(kyleAns||'(무응답)')));
    c.appendChild(el('div','model','<span class="lb">정답 / 모범답안</span>'+esc(model)));
    if(key) c.appendChild(el('div','hint','🔑 '+esc(key)));
    var cm=(g.comments&&g.comments[qnum])||'';
    if(cm){ var r=el('div','res '+(ok?'ok':'no'));
      r.innerHTML='<b>선생님 코멘트</b><div class="arrow">'+esc(cm).replace(/\n/g,'<br>')+'</div>';
      c.appendChild(r); }
    app.appendChild(c);
  }
  app.appendChild(el('h2','sec','Part 1. 객관식'));
  MC.forEach(function(q,i){ idx++;
    var pick=a.mc[i];
    var txt=(pick===null||pick===undefined)?'(무응답)':'ABCD'[pick]+'. '+q.o[pick];
    row(idx,q.tag,q.ko,txt,'ABCD'[q.a]+'. '+q.o[q.a],q.pt); });
  app.appendChild(el('h2','sec','Part 2. 빈칸'));
  FB.forEach(function(q,i){ idx++; row(idx,q.tag,q.ko,a.fb[i],q.a[0],q.pt); });
  app.appendChild(el('h2','sec','Part 3. 영작'));
  TR.forEach(function(q,i){ idx++; row(idx,q.tag,q.ko,a.tr[i],q.m,q.k); });
  var uniq=weak.filter(function(v,i,ar){ return ar.indexOf(v)===i; });
  if(uniq.length){
    var rv=el('div','card'); rv.appendChild(el('div','','<b>🔁 다시 볼 구조</b>'));
    var ul=el('ul','review-list'); uniq.forEach(function(t){ ul.appendChild(el('li','',esc(t))); });
    rv.appendChild(ul); app.appendChild(rv);
  }
  if(blobId){
    var re=el('button','btn sec','✏️ 채점 다시 하기');
    re.onclick=function(){ location.hash='b='+blobId+':re'; location.reload(); };
    app.appendChild(re);
  }
  foot();
}

/* ============================================================ 진입 */
function fatal(t){
  app.innerHTML=''; header('링크 오류',[]);
  app.appendChild(el('div','banner err',t));
  app.appendChild(el('div','card','문제 본문은 안전을 위해 숨겼습니다. 아래 주소로 다시 들어가세요.<br><br>'+
    '<code style="word-break:break-all">'+esc(FALLBACK_BASE)+'</code>'));
  foot();
}
function loading(t){ app.innerHTML=''; header(t,[]); app.appendChild(el('div','card','불러오는 중…')); }

function boot(){
  var h=location.hash.replace(/^#/,''), m;
  if((m=h.match(/^z=(.+)$/))){
    loading('불러오는 중');
    unz(m[1]).then(function(q){
      if(!q||!q.mc||!q.fb||!q.tr) throw new Error('bad');
      app.innerHTML=''; bind(q); renderSolve();
    }).catch(function(){
      app.innerHTML='';
      fatal('⛔ 문제 링크를 읽지 못했습니다. 주소가 중간에 잘렸을 수 있습니다. 주소를 통째로 다시 복사해 열어 보세요.');
    });
    return;
  }
  if((m=h.match(/^b=([^:&]+)(:re)?$/))){
    var id=m[1], forceRe=!!m[2];
    loading('불러오는 중');
    blobRead(id,function(data){
      app.innerHTML='';
      if(!data||!data.a){
        fatal('⛔ 링크가 만료되었거나 손상되었습니다. (채점용 저장소는 <b>마지막 쓰기 기준 24시간</b> 뒤 사라지며, 읽기로는 연장되지 않습니다.)');
        return;
      }
      if(data.q) bind(data.q);
      if(data.g&&!forceRe) renderReview(data,id); else renderGrade(data,id);
    });
    return;
  }
  if((m=h.match(/^s=(.+)$/))){
    var d1=null; try{ d1=b64d(m[1]); }catch(e){ d1=null; }
    app.innerHTML='';
    if(!d1||!d1.a){ fatal('⛔ 백업 링크가 손상되었습니다. 주소가 중간에 잘렸을 수 있습니다.'); return; }
    if(d1.q) bind(d1.q);
    renderGrade(d1,null); return;
  }
  if((m=h.match(/^f=(.+)$/))){
    var d2=null; try{ d2=b64d(m[1]); }catch(e){ d2=null; }
    app.innerHTML='';
    if(!d2||!d2.a||!d2.g){ fatal('⛔ 결과 링크가 손상되었습니다. 주소가 중간에 잘렸을 수 있습니다.'); return; }
    if(d2.q) bind(d2.q);
    renderReview(d2,null); return;
  }
  bind(DEFAULT_QUIZ);
  renderSolve();
}
boot();
</script>
